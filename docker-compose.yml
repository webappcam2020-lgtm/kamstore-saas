version: '3.9'

services:
  # ============================================
  # PostgreSQL Database (with pgvector & pg_trgm)
  # ============================================
  db:
    image: pgvector/pgvector:pg16
    container_name: kamstore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kamstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kamstore_secret_2024}
      POSTGRES_DB: ${POSTGRES_DB:-kamstore_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kamstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kamstore-network

  # ============================================
  # Redis Cache & Celery Queue Broker
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: kamstore-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-kamstore_redis_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-kamstore_redis_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kamstore-network

  # ============================================
  # Backend API - FastAPI (Python 3.12)
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kamstore-backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kamstore}:${POSTGRES_PASSWORD:-kamstore_secret_2024}@db:5432/${POSTGRES_DB:-kamstore_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-2024}
      - DEBUG=${DEBUG:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000}
      - NOTCHPAY_PUBLIC_KEY=${NOTCHPAY_PUBLIC_KEY:-}
      - NOTCHPAY_PRIVATE_KEY=${NOTCHPAY_PRIVATE_KEY:-}
      - NOTCHPAY_HASH_KEY=${NOTCHPAY_HASH_KEY:-}
      - CAMPAY_USERNAME=${CAMPAY_USERNAME:-}
      - CAMPAY_PASSWORD=${CAMPAY_PASSWORD:-}
      - CAMPAY_WEBHOOK_SECRET=${CAMPAY_WEBHOOK_SECRET:-}
      - CAMPAY_ENVIRONMENT=${CAMPAY_ENVIRONMENT:-sandbox}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - SCRAPER_PROXIES=${SCRAPER_PROXIES:-}
      - NUMVERIFY_API_KEY=${NUMVERIFY_API_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@kamstore.cm}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - upload_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kamstore-network

  # ============================================
  # Frontend - Next.js 14 + Tailwind CSS + Zustand
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kamstore-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_NAME=KamStore
      - NEXT_PUBLIC_MAP_TILE_URL=https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - kamstore-network

  # ============================================
  # Celery Worker (Async Scraping & Emailing)
  # ============================================
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kamstore-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kamstore}:${POSTGRES_PASSWORD:-kamstore_secret_2024}@db:5432/${POSTGRES_DB:-kamstore_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-super-secret-key-change-in-production-2024}
      - NOTCHPAY_PUBLIC_KEY=${NOTCHPAY_PUBLIC_KEY:-}
      - NOTCHPAY_PRIVATE_KEY=${NOTCHPAY_PRIVATE_KEY:-}
      - NOTCHPAY_HASH_KEY=${NOTCHPAY_HASH_KEY:-}
      - CAMPAY_USERNAME=${CAMPAY_USERNAME:-}
      - CAMPAY_PASSWORD=${CAMPAY_PASSWORD:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - HUGGINGFACE_API_TOKEN=${HUGGINGFACE_API_TOKEN:-}
      - SCRAPER_PROXIES=${SCRAPER_PROXIES:-}
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kamstore-network

  # ============================================
  # Celery Beat (Scheduled Tasks & Proxy Health)
  # ============================================
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kamstore-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_app beat --loglevel=info
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-kamstore}:${POSTGRES_PASSWORD:-kamstore_secret_2024}@db:5432/${POSTGRES_DB:-kamstore_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-kamstore_redis_2024}@redis:6379/0
    volumes:
      - ./backend/app:/app/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kamstore-network

# ============================================
# Volumes
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  upload_data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  kamstore-network:
    driver: bridge
